<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPC Library | Offline</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #e5e7eb;
        --muted: #a1a1aa;
        --accent: #38bdf8;
        --accent-strong: #0ea5e9;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, var(--bg) 0%, #111827 100%);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 560px);
        background: rgba(17, 24, 39, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
        padding: 36px 30px;
      }

      .eyebrow {
        color: var(--accent);
        font: 700 0.78rem/1.2 Arial, Helvetica, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 7vw, 3.5rem);
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }

      .status {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.4);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .note {
        border-left: 3px solid var(--accent);
        padding-left: 14px;
        font-size: 0.95rem;
      }

      .actions {
        margin-top: 20px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.06);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="eyebrow">CPC Library</div>
      <div class="status">Offline, data stays local</div>
      <h1>You're offline</h1>
      <p>The connection is away for the moment. Cached catalog and personal records remain available in the app, and queued actions will sync when you reconnect.</p>
      <p class="note">Offline mode does not support QR approval, new authentication, or e-book file downloads.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload();">Try again</button>
      </div>
    </main>
  </body>
</html>
